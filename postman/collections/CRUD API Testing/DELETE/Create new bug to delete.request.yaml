$kind: http-request
url: http://localhost:3000/bugs
method: POST
body:
  type: json
  content: "{\r

    \    \"title\": \"This is just a test\",\r

    \    \"description\": \"When I send PATH request to /bugs, instead of status
    code 200, I'm getting 404\",\r

    \    \"employeeId\": 1,\r

    \    \"status\": \"in progress\"\r

    }"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status code is 201\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      pm.test(\"Should return correct title\", function () {\r

      \    pm.expect(json.title).to.eql(\"This is just a test\");\r

      });\r

      \r

      pm.test(\"Should status in progress\", function() {\r

      \    pm.expect(json.status).to.eql(\"in progress\")\r

      })\r

      \r

      pm.collectionVariables.set('bugId', json.id)"
    language: text/javascript
order: 1000
