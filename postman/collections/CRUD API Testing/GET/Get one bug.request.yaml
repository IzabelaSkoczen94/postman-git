$kind: http-request
url: http://localhost:3000/bugs/1
method: GET
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Should return employeeId 1\", function () {\r

      \    pm.expect(json.employeeId).to.eql(1);\r

      });\r

      \r

      pm.test(\"Should return status 'open'\", function () {\r

      \    pm.expect(json.status).to.eql(\"open\");\r

      });\r\n"
    language: text/javascript
order: 5000
