$kind: http-request
url: http://localhost:3000/bugs/:id
method: DELETE
pathVariables:
  id: "{{bugId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |+
      const json = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

    language: text/javascript
order: 5000
