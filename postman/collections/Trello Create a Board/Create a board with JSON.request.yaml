      \r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const boardName = pm.collectionVariables.get(\"boardName\");\r

      \r

      pm.test(`Should return correct board name ${boardName}`, function () {\r

